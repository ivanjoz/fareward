# The fareward SPOE agent (fareward plan, phase 5). Referenced from haproxy.cfg by
#   filter spoe engine fareward config /etc/haproxy/spoe-fareward.conf
#
# HAProxy asks the agent once per request, on the headers, before the body is read: nothing here
# may make HAProxy buffer the request (no `option http-buffer-request` anywhere in the frontend).

[fareward]
spoe-agent fareward-agent
    messages     fareward-check
    # The agent's variables arrive as txn.fw.<name>: status, reason, company, user, route, grant.
    option       var-prefix      fw
    # Any agent failure (down, timeout, protocol error) sets txn.fw.error; haproxy.cfg turns it into
    # a 503. Fail closed, as the backend's own client does.
    option       set-on-error    error
    # One local round trip. Measure p99 in phase 0 and set this just above it.
    timeout      processing      50ms
    use-backend  fareward-spoe

spoe-message fareward-check
    # The four arguments the agent reads. A missing header is sent as NULL: no Content-Length on a
    # charged write is answered 411.
    args method=method path=path auth=req.hdr(authorization) length=req.hdr(content-length)
    event on-frontend-http-request
