# Reference HAProxy configuration for the fareward SPOE agent (fareward plan, phase 5).
#
# Two modes, chosen by an environment variable when HAProxy starts:
#   shadow  (default)          the agent evaluates without charging and HAProxy only logs its
#                              verdict; the backend keeps deciding and charging as before.
#   enforce (FAREWARD_ENFORCE=1) HAProxy refuses on the agent's verdict, and marks the requests it
#                              admitted so the backend skips its own pre-handler frame.
# The agent's own [spoe].mode must match: "shadow" or "enforce".

global
    log stdout format raw local0
    # The SPOE agent runs as the fareward user; the socket is 0660 in its group, so add haproxy's
    # user to that group rather than loosening the mode.
    # Under SELinux, a confined HAProxy (or one in a container) cannot connect to a socket created
    # by an unconfined process: every request then fails closed with txn.fw.error set and the
    # agent sees no connection at all. Label the socket's directory or run both in one domain.

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout http-request 10s

frontend api
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    bind quic4@:443 ssl crt /etc/haproxy/certs/ alpn h3
    http-response set-header alt-svc "h3=\":443\"; ma=86400"

    # Defense independent of the agent: no body above 50 MiB, whatever the route.
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 52428800 }

    # The identity headers are ours. A client sending them is lying, so they go before anything
    # else can read them, in both modes.
    http-request del-header x-fareward-admitted
    http-request del-header x-fareward-company
    http-request del-header x-fareward-user
    http-request del-header x-fareward-route
    http-request del-header x-fareward-grant
    # The backend reads the caller's address from X-Real-IP (core.ClientIPFromRequest), so it is
    # overwritten with the peer HAProxy saw, never passed through from the client.
    http-request set-header x-real-ip %[src]

    filter spoe engine fareward config /etc/haproxy/spoe-fareward.conf

    # The verdict in the access log, in both modes: shadow mode is compared from these lines.
    http-request capture var(txn.fw.status) len 4
    http-request capture var(txn.fw.reason) len 16
    # Set only when the agent could not answer (connection refused, timeout, protocol error).
    http-request capture var(txn.fw.error) len 8

.if defined(FAREWARD_ENFORCE)
    # Fail closed: an agent error, or no verdict at all, is a 503.
    http-request deny deny_status 503 if { var(txn.fw.error) -m found }
    http-request deny deny_status 503 unless { var(txn.fw.status) -m found }

    # The backend's own statuses (fareward src/routes/table.rs and spoe/agent.rs).
    http-request deny deny_status 400 if { var(txn.fw.status) -m int eq 400 }
    http-request deny deny_status 401 if { var(txn.fw.status) -m int eq 401 }
    http-request deny deny_status 403 if { var(txn.fw.status) -m int eq 403 }
    # 411 has no built-in error page, so it is answered with an explicit body.
    http-request return status 411 content-type "application/json" string "{\"error\":\"Content-Length required\"}" if { var(txn.fw.status) -m int eq 411 }
    http-request deny deny_status 413 if { var(txn.fw.status) -m int eq 413 }
    http-request deny deny_status 429 if { var(txn.fw.status) -m int eq 429 }
    http-request deny deny_status 500 if { var(txn.fw.status) -m int eq 500 }
    # Anything else that is not "go on" fails closed.
    http-request deny deny_status 503 unless { var(txn.fw.status) -m int eq 0 }

    # Admitted: tell the backend who it is and that the gate already ran (plan D5). The backend
    # trusts these only from a local connection, and only because this block deleted the client's.
    http-request set-header x-fareward-admitted 1
    http-request set-header x-fareward-company %[var(txn.fw.company)]
    http-request set-header x-fareward-user %[var(txn.fw.user)]
    http-request set-header x-fareward-route %[var(txn.fw.route)]
    http-request set-header x-fareward-grant %[var(txn.fw.grant),hex] if { var(txn.fw.grant) -m found }
.endif

    default_backend genix

backend genix
    # The Go backend on this host. It must listen on loopback (or a Unix socket) only: the
    # x-fareward-* headers are trusted because nothing but this HAProxy can reach it, and only
    # once [fareward].trust_edge_headers = true is set in its config.toml.
    server genix 127.0.0.1:3589

backend fareward-spoe
    # HAProxy 3.1+ (SPOP 2.0). Verified end to end against 3.2.
    mode spop
    timeout connect 1s
    timeout server  30s
    # [spoe].socket in the daemon's config.
    server fareward unix@/run/fareward/spoe.sock
