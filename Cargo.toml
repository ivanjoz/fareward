[package]
name = "fareward"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
blake2 = "0.11.0"
# The colbin wire format, encoded and decoded by the repository that defines it rather
# than transcribed here. Six of the eight request frames are colbin messages and the
# session token is one, so both halves of this daemon depend on it.
#
# Pinned by tag, which used to be impossible: colbin's tags were its Go module's version
# ladder and the crate did not exist yet. `v0.2.0` is the first tag that carries both, so
# the Go client and this daemon can name the same version of the format.
#
# `derive` brings in the proc-macro crate. Without it the trait is still here and an impl
# can be hand-written; with it, `#[derive(Colbin)]` emits the straight-line encode and
# decode, which is what every frame struct in src/ uses.
colbin = { git = "https://github.com/ivanjoz/colbin", tag = "v0.3.0", features = ["derive"] }
getrandom = "0.4"
# Only for statvfs, which is how the disk column is read: nothing under /proc reports free space.
libc = "0.2"
scylla = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Only to compress a configuration secret into the 128-bit key SipHash takes: see src/siphash.rs.
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# ServiceExt::oneshot drives the axum router in tests without binding a real socket.
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
